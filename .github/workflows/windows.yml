# Windows compile-proof CI (tickets #20/#22; spec decision 9): configure +
# build the plugin — including the CUDA translation units — under MSVC + CUDA
# Toolkit 12.9, run the portable unit suite, and upload a spec-correct bundle
# tree. Hosted runners have no GPU and no Resolve, so test_cuda_downscale
# skips itself (compile-proof only) and Tiers 1-2 of the testing loop stay
# human (BUILD.md, Windows section).
#
# The NDI Advanced SDK is access-gated and never lives in CI: the build links
# a stub import library generated from the checked-in export list
# (third_party/ndi/), so the artifact proves compile + link, not streaming.
name: windows

on:
  push:
    branches:
      - windows-port
      - "feature/win-**"
  pull_request:
    branches:
      - windows-port
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # nvcc + cudart are what the compile needs; visual_studio_integration
      # supplies the MSBuild files the VS generator's CUDA toolset loads. The
      # configure step points CMake straight at the toolkit (-T cuda=...) so
      # the build never depends on the integration being copied into the VS
      # installation itself — the same recipe BUILD.md documents for a
      # workstation without admin rights.
      - name: Install CUDA Toolkit 12.9 (compile only)
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.9.2'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Configure (CMake + vcpkg toolchain + CUDA)
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -T "cuda=$env:CUDA_PATH"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build (Release, CUDA included)
        run: cmake --build build --config Release --parallel

      - name: Run portable unit tests (MSVC)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the OFX bundle tree
        run: cmake --install build --config Release --prefix stage

      - name: Verify spec bundle layout
        run: |
          $ofx = "stage/NDIOutput.ofx.bundle/Contents/Win64/NDIOutput.ofx"
          if (-not (Test-Path $ofx)) {
            Write-Error "Bundle layout wrong: $ofx missing"
            exit 1
          }
          Get-ChildItem -Recurse stage | Select-Object FullName

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: NDIOutput-win64
          path: stage/
          if-no-files-found: error
